<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Alianza Santiago & Lester</title>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;
  --nav:#0f172a;--nav-tx:#fff;
  --pri:#2563eb;--pri-d:#1d4ed8;--pri-bg:#eff6ff;
  --cta:#f97316;--cta-d:#ea580c;--cta-bg:#fff7ed;
  --ok:#16a34a;--ok-bg:#f0fdf4;--rd:#dc2626;--rd-bg:#fef2f2;--wn:#d97706;--wn-bg:#fffbeb;
  --r:18px;--r-sm:12px;
  --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.08);
  --sh-lg:0 12px 32px rgba(15,23,42,.14);
  --tr:.2s cubic-bezier(.4,0,.2,1);--nav-h:72px;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b1220;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ln:#334155;
  --pri-bg:#172554;--cta-bg:#431407;--ok-bg:#052e16;--rd-bg:#450a0a;--wn-bg:#451a03;
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--nav);color:var(--nav-tx);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:500;box-shadow:var(--sh-md)}
.topbar b{font-size:1rem;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.topbar .right{display:flex;align-items:center;gap:10px}
.rate-badge{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.3px;border:1px solid rgba(255,255,255,.2)}
#clk{opacity:.85;font-variant-numeric:tabular-nums;font-size:.72rem}

/* Hero */
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 45%,#f97316 130%);color:#fff;text-align:center;padding:36px 20px 30px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(249,115,22,.35),transparent 55%),radial-gradient(circle at 85% 80%,rgba(37,99,235,.4),transparent 55%)}
.hero h1{font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:-1.4px;line-height:1.05;position:relative}
.hero h1 em{font-style:normal;color:#fb923c}
.hero p{font-size:.72rem;opacity:.85;letter-spacing:4px;margin-top:10px;font-weight:700;position:relative}
.hero svg{display:block;width:100%;max-width:460px;margin:16px auto 0;position:relative}

/* Main & Card */
main{max-width:760px;margin:0 auto;padding:16px 14px 24px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px 18px;margin-bottom:14px;box-shadow:var(--sh);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{font-size:1.05rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.card h3 .ico{width:30px;height:30px;border-radius:10px;background:var(--pri-bg);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}

/* KPI / prices */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--pri-bg);border-radius:14px;padding:14px;border:1px solid transparent;transition:all var(--tr)}
.k:hover{border-color:var(--pri);transform:translateY(-1px)}
.k small{color:var(--mu);display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.k-val{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.2}
.k-val.pos{color:var(--ok)}.k-val.neg{color:var(--rd)}
.money{display:inline-flex;flex-direction:column;line-height:1.2;text-align:left}
.m-cup{font-weight:800;font-variant-numeric:tabular-nums}
.m-usd{font-size:.72rem;color:var(--mu);font-weight:600;margin-top:1px}

/* Buttons */
button{font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:11px 18px;border-radius:12px;transition:all var(--tr);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
button:hover{background:var(--pri-bg);border-color:var(--pri)}
button:active{transform:scale(.97)}
button.pr{background:linear-gradient(135deg,var(--cta),var(--cta-d));color:#fff;border:none;box-shadow:0 4px 12px rgba(249,115,22,.35)}
button.pr:hover{filter:brightness(1.06)}
button.cta{width:100%;padding:14px;font-size:1rem;border-radius:14px;margin-top:8px}
button.wa{background:#25d366;color:#fff;border:none;box-shadow:0 4px 12px rgba(37,211,102,.3)}
button.wa:hover{filter:brightness(1.06)}
button.dg{color:var(--rd);border-color:var(--rd)}
button.dg:hover{background:var(--rd-bg)}
button:disabled{opacity:.5;cursor:not-allowed}

/* Inputs */
input,select{font:inherit;font-size:.95rem;color:var(--tx);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:11px 13px;max-width:100%;transition:all var(--tr);width:100%;min-height:44px}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15);background:var(--card)}
input[readonly]{background:var(--ln);color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:10px 0}
.row>div{display:flex;flex-direction:column;min-width:0;flex:1 1 150px}
.row label{font-size:.72rem;color:var(--mu);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}

/* Tables */
.tw{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--ln)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border-bottom:1px solid var(--ln);padding:11px 10px;text-align:left;white-space:nowrap;vertical-align:middle}
th{color:var(--mu);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;background:var(--bg)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--pri-bg)}
td input{width:85px;padding:6px 8px;font-size:.82rem;min-height:auto}
tr.sel td{background:var(--pri-bg);border-left:3px solid var(--pri)}
td small.mu{font-size:.72rem}

/* Utilities */
.mu{color:var(--mu);font-size:.8rem;line-height:1.45}
.pos{color:var(--ok)}.neg{color:var(--rd)}
.bar{height:12px;background:var(--ln);border-radius:99px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);border-radius:99px;transition:width .8s ease;box-shadow:0 0 8px rgba(22,163,74,.4)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.rd{background:var(--rd-bg);color:var(--rd)}
.badge.pri{background:var(--pri-bg);color:var(--pri)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:12px 22px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Login */
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 60%,#f97316 200%)}
.login-wrap{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:32px 24px;box-shadow:var(--sh-lg)}
.login-wrap .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#0f172a,#f97316);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;margin:0 auto 16px;box-shadow:0 8px 24px rgba(15,23,42,.3)}
.login-wrap h2{text-align:center;font-size:1.7rem;font-weight:900;margin-bottom:4px;letter-spacing:-.6px}
.login-wrap .sub{text-align:center;color:var(--mu);font-size:.9rem;margin-bottom:22px}
.pick-label{font-size:.78rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;text-align:center}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.user-card{background:var(--bg);border:2px solid var(--ln);border-radius:16px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:auto;cursor:pointer;transition:all var(--tr)}
.user-card:hover{border-color:var(--pri);background:var(--pri-bg);transform:translateY(-2px)}
.user-card.sel{border-color:var(--cta);background:var(--cta-bg);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.user-card .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4rem;margin-bottom:4px}
.user-card b{font-size:.95rem;font-weight:800}
.user-card small{font-size:.72rem;color:var(--mu);font-weight:600}

/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(15,23,42,.1)}
.bnav button{background:none;border:none;padding:6px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:.65rem;font-weight:700;flex:1;max-width:84px;min-height:auto}
.bnav button svg{width:24px;height:24px;stroke-width:2.2}
.bnav button.on{color:var(--cta)}
.bnav button.on svg{stroke:var(--cta)}
.bnav button:hover{background:var(--cta-bg)}

/* Menu grid */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}
.menu-grid button{background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:18px 8px;flex-direction:column;gap:8px;font-size:.78rem;height:auto;font-weight:700;box-shadow:var(--sh);min-height:auto}
.menu-grid button:hover{border-color:var(--cta);background:var(--cta-bg);transform:translateY(-2px)}
.menu-grid .mi{width:44px;height:44px;border-radius:14px;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:1.2rem}

/* Manual */
.manual h2{font-size:1.25rem;font-weight:900;margin:22px 0 10px;color:var(--pri);letter-spacing:-.4px;padding-top:12px;border-top:1px solid var(--ln)}
.manual h2:first-child{border-top:none;padding-top:0;margin-top:0}
.manual h3{font-size:1rem;font-weight:800;margin:16px 0 6px}
.manual p{margin:8px 0;line-height:1.65;font-size:.92rem}
.manual ol,.manual ul{margin:8px 0 8px 22px;font-size:.9rem;line-height:1.65}
.manual li{margin:5px 0}
.manual blockquote{background:var(--pri-bg);border-left:4px solid var(--pri);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.88rem;font-style:italic;color:var(--mu)}
.manual .step{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.manual .step b{background:var(--cta);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;font-weight:800}
.manual .step span{flex:1;font-size:.9rem;line-height:1.55}
</style>
</head>
<body>
<div class="topbar">
  <b>🤝 Alianza</b>
  <div class="right">
    <span class="rate-badge" id="rateBadge">1 USD = 860 CUP</span>
    <span id="clk"></span>
  </div>
</div>
<div id="root"></div>
<div id="toast"></div>
<script>
/* ============ MODELO v6 ============
- Cuentas: car, san, les, osv (Osvaldito · préstamo).
- Préstamo de Osvaldito: exclusivamente USD.
- Cada operación conserva su tasa (rate) y fecha/hora.
- rates[]: histórico de tasas (nunca se sobrescribe).
- exchanges[]: registro de CUP→USD con tasa aplicada.
- pendingCUP[]: CUP destinados a cambiar; el equivalente USD se recalcula al tipo actual.
*/
const KEY="alianza-v6", OLD=["alianza-v5","alianza-v4"];
const ACT=[["pas","Pasajeros"],["ges","Gestión coordinada"],["per","Uso personal"]];
const ACC_LBL={car:"Carro",san:"Santiago",les:"Lester",osv:"Osvaldito · préstamo"};
const UID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toTimeString().slice(0,5);
const $=s=>document.querySelector(s);
const v=i=>document.getElementById(i).value;
const N=(x,d=0)=>(+x||0).toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d});
const E=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let S,me=null,sel=null,tab="dash",q="",armed="",qm=today().slice(0,7),qh=+today().slice(8)<=15?1:2;

function seed(){
  return{
    cfg:{rate:860,loanPct:50,loanOn:true,wa:"5354065166",
      shares:[{id:"car",n:"Carro",pct:30},{id:"san",n:"Santiago",pct:50},{id:"les",n:"Lester",pct:20}]},
    users:[{u:"lester",p:"Lester2026",role:"admin",n:"Lester"},{u:"santiago",p:"Santi2026",role:"rep",n:"Santiago"}],
    trips:[],fuel:[],inv:[],lexp:[],orders:[],caja:[],dist:[],log:[],
    rates:[{id:UID(),d:today(),t:now(),rate:860,by:"Sistema",note:"Tasa inicial"}],
    exchanges:[],pendingCUP:[]
  };
}
try{
  S=JSON.parse(localStorage.getItem(KEY));
  if(!S)for(const k of OLD){const o=localStorage.getItem(k);if(o){S=JSON.parse(o);break}}
  const u=sessionStorage.getItem("u");if(u&&S)me=S.users.find(x=>x.u==u);
}catch(e){}
if(!S)S=seed();
S.rates=S.rates||[];S.exchanges=S.exchanges||[];S.pendingCUP=S.pendingCUP||[];
S.cfg=S.cfg||{};S.cfg.rate=+S.cfg.rate||860;
(S.dist||[]).forEach(d=>{if(d.payUsd==null)d.payUsd=(+d.payCup||0)/(+d.rate||S.cfg.rate)});
(S.caja||[]).forEach(c=>{if(!c.cur){c.cur=c.acc==="osv"?"USD":"CUP";c.rate=+c.rate||S.cfg.rate}});
(S.lexp||[]).forEach(l=>{if(l.loan&&l.loanUsd==null)l.loanUsd=l.cur==="USD"?(+l.amt||0):(+l.amt||0)/(+l.rate||S.cfg.rate);if(l.rate==null)l.rate=S.cfg.rate});

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Memoria llena")}};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)};
const lg=(a,x)=>S.log.push({id:UID(),d:today(),t:now(),u:me.n,a,x});
const A=()=>me&&me.role=="admin";

/* ===== Tasas y conversiones ===== */
const currentRate=()=>+S.cfg.rate||1;
const rateAt=(d,t="23:59")=>{
  const c=S.rates.filter(x=>(x.d<d)||(x.d==d&&x.t<=t)).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  return c.length?c[c.length-1].rate:S.cfg.rate;
};
const usdEq=(cupAmt,rate=currentRate())=>(+cupAmt||0)/(+rate||1);
const cupEq=(usdAmt,rate=currentRate())=>(+usdAmt||0)*(+rate||1);
const cup=r=>r.cur=="USD"?(+r.amt||0)*(+r.rate||currentRate()):(+r.amt||0);
const sum=a=>a.reduce((s,r)=>s+cup(r),0);
const sn=id=>ACC_LBL[id]||(S.cfg.shares.find(s=>s.id==id)||{n:id}).n;

/* ===== Helpers de dinero con equivalente ===== */
const mCUP=(c,r=currentRate())=>`<span class="money"><span class="m-cup">${N(c)} CUP</span><span class="m-usd">≈ USD ${N(usdEq(c,r),2)}</span></span>`;
const mUSD=(u,r=currentRate())=>`<span class="money"><span class="m-cup">USD ${N(u,2)}</span><span class="m-usd">≈ ${N(cupEq(u,r))} CUP</span></span>`;
const tCUP=(c,r=currentRate())=>`${N(c)} CUP<br><small class="mu">≈ USD ${N(usdEq(c,r),2)}</small>`;
const tUSD=(u,r=currentRate())=>`USD ${N(u,2)}<br><small class="mu">≈ ${N(cupEq(u,r))} CUP</small>`;

/* ===== Préstamo Osvaldito (USD) ===== */
const loanTot=()=>S.inv.filter(i=>i.loan).reduce((s,i)=>s+(+i.amt||0),0)
  + S.lexp.filter(l=>l.loan).reduce((s,l)=>s+(+l.loanUsd||0),0);
const loanPaid=()=>S.dist.reduce((s,d)=>s+(d.payUsd!=null?d.payUsd:((d.payCup||0)/(d.rate||S.cfg.rate))),0);
const loanPend=()=>Math.max(loanTot()-loanPaid(),0);
const cr=(a,u)=>S.caja.filter(c=>c.kind=="c"&&c.acc==a&&(!u||c.d<=u)).reduce((s,c)=>s+c.amt,0);
const rt=(a,u,f)=>S.caja.filter(c=>c.kind=="r"&&c.acc==a&&(!u||c.d<=u)&&(!f||c.d>=f)).reduce((s,c)=>s+c.amt,0);
const bal=(a,u)=>cr(a,u)-rt(a,u);

function cc(d,litN){
  const T=S.trips.filter(r=>r.d==d&&r.act!="per");
  const F=S.fuel.filter(r=>r.d==d);
  const I=sum(T);
  const litT=F.reduce((s,r)=>s+r.lit,0);
  const imp=sum(F);
  let pl=0;
  if(litT>0)pl=imp/litT;
  else{const last=S.fuel.filter(r=>r.d<=d&&r.lit).sort((a,b)=>a.d>b.d?1:-1).pop();if(last)pl=last.precio||(cup(last)/last.lit)}
  if(!pl||pl<=0)pl=600;
  const fN=litN*pl, litO=Math.max(litT-litN,0), fO=litO*pl;
  const rate=rateAt(d,now());
  const Nt=I-fN;
  const payCup=S.cfg.loanOn&&Nt>0?Math.min(Nt*S.cfg.loanPct/100,loanPend()*rate):0;
  const rest=Nt>0?Nt-payCup:0;
  const sh={};
  S.cfg.shares.forEach(s=>sh[s.id]=Nt>0?rest*s.pct/100:0);
  return{I,litT,imp,pl,litN,fN,litO,fO,Nt,payCup,payUsd:payCup/rate,rate,rest,sh};
}
const qk=d=>d.slice(0,7)+"-"+(+d.slice(8)<=15?1:2);
const mn=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleString("es",{month:"long",year:"numeric"});
const ql=k=>`${k.slice(-1)==1?"1ª":"2ª"} quincena de ${mn(k.slice(0,7))}`;

/* ===== Inputs genéricos ===== */
const SEL={act:()=>ACT,cur:()=>["CUP","USD"],loan:()=>[["1","Sí, es préstamo"],["0","No"]]};
const D=["d","date","Fecha"],H=["t","time","Hora"],AM=["amt","number","Monto"],CU=["cur","cur","Moneda"];
const MOD={
  trips:{t:"Viajes y paquetería",f:[D,H,["act","act","Actividad"],["from","text","Origen"],["to","text","Destino"],AM,CU,["desc","text","Descripción"]],req:["amt"],m:1},
  fuel:{t:"Combustible comprado",f:[D,H,["lit","number","Litros"],["precio","number","Precio CUP/L"],["amt","number","Importe total"],CU,["note","text","Notas"]],req:["lit","precio"],m:1,x:["ppl"]},
  inv:{t:"Inversiones (préstamo Osvaldito, USD)",f:[D,["what","text","Concepto"],["amt","number","Monto USD"],["loan","loan","¿Préstamo?"]],req:["what","amt"],fix:{cur:"USD"},m:1},
  lexp:{t:"Gastos de Lester (compras enviadas a Santiago)",f:[D,["what","text","Concepto"],["amt","number","Importe de compra"],["cur","cur","Moneda del gasto"],["loan","loan","¿Se incorpora al préstamo Osvaldito?"],["note","text","Notas"]],req:["what","amt"],m:1}
};
const inp=(k,f)=>{
  const[key,ty,lb]=f,id=`f_${k}_${key}`,w=key=="desc"?` id="wdesc" style="display:none"`:"";
  if(SEL[ty])return`<div><label>${lb}</label><select id="${id}">${SEL[ty]().map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${a}">${b}</option>`}).join("")}</select></div>`;
  if(k=="fuel"&&key=="amt")return`<div><label>${lb} (auto)</label><input id="${id}" type="number" step="any" readonly></div>`;

};
const cell=(r,key)=>{
  if(key=="act")return E((ACT.find(a=>a[0]==r.act)||["","?"])[1]);
  if(key=="loan")return r.loan?"Sí":"No";
  if(key=="cup"){const rate=r.rate||currentRate();return r.cur=="USD"?tUSD(r.amt,rate):tCUP(r.amt,rate)}
  if(key=="ppl")return N(cup(r)/r.lit,2);
  if(key=="amt"){if(r.cur=="USD")return tUSD(r.amt,r.rate||currentRate());return tCUP(r.amt,r.rate||currentRate())}
  return E(r[key]);
};

const KS=["trips","fuel","inv","lexp","orders","caja","dist","log","rates","exchanges","pendingCUP"];
function expo(full){
  const f=v("xf"),t=v("xt"),ok=d=>!d||((!f||d>=f)&&(!t||d<=t));
  const o={v:6,by:me.n,ts:new Date().toISOString(),from:f,to:t};
  KS.forEach(k=>o[k]=S[k].filter(r=>ok(r.d)));
  if(full&&A()){o.cfg=S.cfg;o.users=S.users}
  return o;
}
function imp(o,rc){
  let n=0;
  KS.forEach(k=>(o[k]||[]).forEach(i=>{if(!S[k].some(x=>x.id==i.id)){S[k].push(i);n++}}));
  if(A()&&rc&&o.cfg){S.cfg=o.cfg;S.users=o.users||S.users}
  lg("Importó salva",`${n} nuevos de ${o.by||"?"}`);
  return n;
}
function enviarSalvaDia(){
  const d=$("#cd")?v("cd"):today();
  const o={v:6,by:me.n,ts:new Date().toISOString(),from:d,to:d};
  KS.forEach(k=>o[k]=S[k].filter(r=>r.d==d));
  const D0=S.dist.filter(x=>x.d==d)[0]||{};
  const g=k=>D0[k]||0;
  const txt=`📋 *Salva del día ${d}*\n📊 Ingresos: ${N(g("I"))} CUP (≈ USD ${N(usdEq(g("I"),D0.rate||currentRate()),2)})\n⛽ Combustible: ${N(g("fN"))} CUP\n💰 Neta: ${N(g("Nt"))} CUP (≈ USD ${N(usdEq(g("Nt"),D0.rate||currentRate()),2)})\n🏦 A Osvaldito: USD ${N(g("payUsd"),2)}\n👥 Reparto: ${S.cfg.shares.map(s=>s.n+" "+N((D0.sh||{})[s.id]||0)).join(" · ")}\n📉 Préstamo pendiente: USD ${N(loanPend(),2)}`;
  window.open(`https://wa.me/${S.cfg.wa}?text=${encodeURIComponent(txt)}`,"_blank","noopener");
  lg("Envió salva por WhatsApp",d);
  const file=new File([JSON.stringify(o)],`salva-${d}.json`,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:"Salva Alianza"}).catch(()=>{});
}

/* ===== Eventos ===== */
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;R()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="lp")document.querySelector("[data-login]")?.click()});

document.addEventListener("click",async e=>{
  const tg=e.target.closest("[data-login],[data-out],[data-t],[data-add],[data-del],[data-close],[data-ret],[data-as],[data-ds],[data-au],[data-du],[data-reset],[data-x],[data-q],[data-wadian],[data-addorder],[data-useorder],[data-rate-save],[data-exchange],[data-pending-add],[data-pick]");
  if(!tg)return;const d=tg.dataset;

  if(d.pick){sel=d.pick;R();setTimeout(()=>$("#lp")?.focus(),100);return}
  if(d.login){
    if(!sel)return toast("Selecciona un usuario");
    const u=S.users.find(x=>x.u==sel&&x.p==v("lp"));
    if(!u)return toast("Clave incorrecta");
    me=u;try{sessionStorage.setItem("u",u.u)}catch(z){}tab="dash";lg("Inició sesión","");return R();
  }
  if(d.out){me=null;sel=null;try{sessionStorage.removeItem("u")}catch(z){}return R()}
  if(d.t){tab=d.t;q="";armed="";return R()}
  if(d.q){qm=d.q.slice(0,7);qh=+d.q.slice(-1);return R()}

  if(d.add){
    const k=d.add,M=MOD[k],r={id:UID(),rate:S.cfg.rate,by:me.n,...(M.fix||{})};
    M.f.forEach(([key,ty])=>{let x=v(`f_${k}_${key}`);if(ty=="number")x=+x;if(ty=="loan")x=x=="1";r[key]=x});
    r.rate=rateAt(r.d||today(),now());
    if(k=="inv"){r.cur="USD";r.loan=true;}
    if(k=="fuel"&&r.lit&&r.precio)r.amt=r.lit*r.precio;
    if(k=="lexp"){r.loanUsd=r.loan?(r.cur=="USD"?r.amt:usdEq(r.amt,r.rate)):0}
    if(k=="trips"){if(r.act=="per")r.amt=0;else if(!r.amt)return toast("Falta el monto");if(r.act=="ges"&&!r.desc)return toast("Describe la gestión")}
    else if(M.req.some(x=>!r[x]))return toast("Completa los campos");
    S[k].push(r);lg("Registró: "+M.t,`${r.what||r.desc||""} ${r.lit?N(r.lit,1)+" L ":""}${r.amt?N(r.amt,2)+" "+r.cur:""}`);
    toast("Guardado");return R();
  }
  if(d.del){const[k,id]=d.del.split("|");if(armed!=k+id){armed=k+id;return R()}S[k]=S[k].filter(r=>r.id!=id);if(k=="dist")S.caja=S.caja.filter(c=>c.auto!=id);lg("Eliminó",k);armed="";return R()}

  if(d.rateSave){
    const rate=+v("rate");if(!(rate>0))return toast("La tasa debe ser > 0");
    S.rates.push({id:UID(),d:today(),t:now(),rate,by:me.n,note:$("#rateNote")?.value||""});
    S.cfg.rate=rate;lg("Registró tasa",`${rate} CUP/USD`);toast("Tasa registrada");return R();
  }

  if(d.exchange){
    const cupAmt=+v("excup"),rate=+v("exrate"),fee=+v("exfee")||0;
    if(!(cupAmt>0&&rate>0))return toast("Introduce CUP y tasa válidos");
    const grossUsd=cupAmt/rate,usdNet=grossUsd-fee;
    if(usdNet<0)return toast("La comisión no puede superar el cambio");
    S.exchanges.push({id:UID(),d:v("exd")||today(),t:v("ext")||now(),cup:cupAmt,rate,grossUsd,feeUsd:fee,usd:usdNet,note:v("exnote"),by:me.n});
    let left=cupAmt;
    for(const p of S.pendingCUP){const due=Math.max(0,p.amount-(p.converted||0));const take=Math.min(left,due);p.converted=(p.converted||0)+take;left-=take;if(left<=0)break}
    lg("Cambió CUP a USD",`${N(cupAmt)} CUP ÷ ${rate} = USD ${N(usdNet,2)}`);
    toast("Cambio guardado con tasa histórica");return R();
  }

  if(d.pendingAdd){
    const amt=+v("pcamt"),note=v("pcnote");
    if(!(amt>0)||!note)return toast("Indica concepto e importe");
    S.pendingCUP.push({id:UID(),d:today(),note,amount:amt,converted:0,by:me.n});
    lg("Añadió CUP pendientes",`${N(amt)} CUP · ${note}`);return R();
  }

  if(d.close){
    const dt=v("cd"),L=v("cl")===""?cc(dt,0).litT:+v("cl"),c=cc(dt,L);
    if(S.dist.some(x=>x.d==dt))return toast("Día ya cerrado");
    if(!c.I&&!c.litT)return toast("Sin movimientos");
    const id=UID();S.dist.push({id,d:dt,by:me.n,...c});
    S.cfg.shares.forEach(s=>c.sh[s.id]>0&&S.caja.push({id:UID(),d:dt,t:now(),acc:s.id,kind:"c",concept:"Reparto "+dt,amt:c.sh[s.id],cur:"CUP",rate:c.rate,by:me.n,auto:id}));
    if(c.payUsd>0)S.caja.push({id:UID(),d:dt,t:now(),acc:"osv",kind:"c",concept:"Abono préstamo Osvaldito "+dt,amt:c.payUsd,cur:"USD",rate:c.rate,cupEq:c.payCup,by:me.n,auto:id});
    lg("Cerró día",`${dt}: neta ${N(c.Nt)} CUP, abono USD ${N(c.payUsd,2)}`);toast("Día cerrado y repartido");return R();
  }
  if(d.wadian){enviarSalvaDia();return}

  if(d.ret){
    const a=v("ra"),m=+v("rm");
    if(!v("rc")||!(m>0))return toast("Completa concepto y monto");
    if(m>bal(a))return toast("Supera saldo ("+(a=="osv"?N(bal(a),2)+" USD":N(bal(a))+" CUP")+")");
    const rate=rateAt(v("rd")||today(),now());
    S.caja.push({id:UID(),d:v("rd")||today(),t:now(),acc:a,kind:"r",concept:v("rc"),amt:m,cur:a=="osv"?"USD":"CUP",rate,by:me.n});
    lg("Retiro",`${sn(a)}: ${N(m,2)} ${a=="osv"?"USD":"CUP"}`);toast("Registrado");return R();
  }

  if(d.addorder){
    const acc=v("oa"),concept=v("oc"),amt=+v("om"),cur=v("ocur");
    if(!concept||!(amt>0))return toast("Completa concepto y monto");
    S.orders.push({id:UID(),d:today(),by:me.n,acc,concept,amt,cur,status:"pend",rate:currentRate()});
    lg("Creó pedido",`${sn(acc)}: ${N(amt)} ${cur} · ${concept}`);toast("Pedido creado");return R();
  }
  if(d.useorder){
    const o=S.orders.find(x=>x.id==d.useorder);if(!o||o.status=="used")return toast("No disponible");
    const rate=currentRate();
    const amtNative=o.cur=="USD"?o.amt:o.amt;
    const amtCUP=o.cur=="USD"?o.amt*rate:o.amt;
    const curAcc=o.acc=="osv"?"USD":"CUP";
    const nativeAmt=curAcc=="USD"?usdEq(amtCUP,rate):amtCUP;
    if(nativeAmt>bal(o.acc))return toast("Saldo insuficiente en "+sn(o.acc));
    S.caja.push({id:UID(),d:today(),t:now(),acc:o.acc,kind:"r",concept:"Pedido: "+o.concept,amt:nativeAmt,cur:curAcc,rate,by:me.n});
    o.status="used";o.usedD=today();o.usedBy=me.n;
    lg("Usó pedido",`${sn(o.acc)}: ${N(nativeAmt,2)} ${curAcc} · ${o.concept}`);
    toast("Pedido usado y retiro registrado");return R();
  }

  if(d.as&&v("ns")){S.cfg.shares.push({id:UID(),n:v("ns"),pct:+v("np")||0});lg("Agregó socio",v("ns"));return R()}
  if(d.ds){S.cfg.shares=S.cfg.shares.filter(s=>s.id!=d.ds);return R()}
  if(d.au&&v("uu")&&v("up")){if(S.users.some(x=>x.u==v("uu").toLowerCase()))return toast("Usuario existe");S.users.push({u:v("uu").toLowerCase(),p:v("up"),role:v("ur"),n:v("un")||v("uu")});lg("Creó usuario",v("uu"));return R()}
  if(d.du){S.users=S.users.filter(x=>x.u!=d.du);lg("Eliminó usuario",d.du);return R()}
  if(d.reset){if(armed!="reset"){armed="reset";return R()}try{localStorage.removeItem(KEY)}catch(z){}S=seed();me=null;sel=null;armed="";return R()}

  if(d.x){
    const full=d.x=="full",o=expo(full),f=`salva-${me.u}-${today()}.json`;
    if(d.x=="wa"){
      const g=k=>(o.dist||[]).reduce((s,x)=>s+(x[k]||0),0);
      const txt=`Reporte ${me.n} ${o.from||""} a ${o.to||""}\nIngresos: ${N(g("I"))} CUP (≈ USD ${N(usdEq(g("I")),2)})\nNeta: ${N(g("Nt"))} CUP (≈ USD ${N(usdEq(g("Nt")),2)})\nA Osvaldito: USD ${N(g("payUsd"),2)}\n${S.cfg.shares.map(s=>s.n+": "+N((o.dist||[]).reduce((a,x)=>a+((x.sh||{})[s.id]||0),0))+" CUP").join(" · ")}\nPréstamo pendiente: USD ${N(loanPend(),2)}`;
      window.open(`https://wa.me/${S.cfg.wa}?text=${encodeURIComponent(txt)}`,"_blank","noopener");lg("Envió WhatsApp","");return;
    }
    const file=new File([JSON.stringify(o)],f,{type:"application/json"});lg("Exportó salva",f);
    if(!full&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Salva Alianza"});return}catch(z){}}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=f;a.click();toast("Salva descargada");
  }
});

document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset,c=S.cfg;
  if(t.id=="f_trips_act"){$("#wdesc").style.display=t.value=="ges"?"":"none";return}
  if(t.id=="qm"){qm=t.value||qm;return R()}
  if(t.id=="qh"){qh=+t.value;return R()}
  if(d.cf){c[d.cf]=t.type=="checkbox"?t.checked:t.type=="number"?+t.value:t.value;lg("Cambió config",d.cf);return R()}
  if(d.sn){c.shares.find(s=>s.id==d.sn).n=t.value;return R()}
  if(d.sp){c.shares.find(s=>s.id==d.sp).pct=+t.value;lg("Cambió porcentajes","");return R()}
  if(d.pw&&t.value){S.users.find(x=>x.u==d.pw).p=t.value;lg("Cambió clave",d.pw);toast("Clave actualizada");t.value="";}
  if(t.id=="ra"){const l=$("#rmLabel");if(l)l.textContent=t.value=="osv"?"Monto USD (préstamo)":"Monto CUP";return}
  if(["cd","cl","cf","af","au"].includes(t.id))return R();
  if(t.id=="imp"){
    const f=t.files[0],r=new FileReader();
    r.onload=()=>{try{const n=imp(JSON.parse(r.result),$("#ic")&&$("#ic").checked);toast(`Salva importada: ${n} registros nuevos`);R()}catch(z){toast("Archivo no válido")}};
    f&&r.readAsText(f);
  }
});

R();
</script>
</body>
</html>
