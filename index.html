<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alianza Santiago & Lester</title>
<style>
:root{
  --pri:#6366f1;--pri-d:#4f46e5;--pri-l:#eef2ff;--pri-g:linear-gradient(135deg,#6366f1,#8b5cf6);
  --ok:#10b981;--ok-l:#ecfdf5;--rd:#ef4444;--rd-l:#fef2f2;--wn:#f59e0b;
  --bg:#f8fafc;--card:#fff;--tx:#1e293b;--mu:#64748b;--ln:#e2e8f0;--ln-d:#cbd5e1;
  --r:16px;--r-sm:10px;--sh:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.08);--sh-lg:0 12px 32px rgba(15,23,42,.12);
  --tr:.2s cubic-bezier(.4,0,.2,1);--nav-h:68px;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --pri-l:#1e1b4b;--ok-l:#064e3b;--rd-l:#7f1d1d;--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ln:#334155;--ln-d:#475569;
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
/* Topbar */
.topbar{position:sticky;top:0;z-index:20;background:var(--pri-g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:500;box-shadow:var(--sh-md)}
.topbar b{font-size:.95rem;font-weight:700;letter-spacing:-.3px}
.topbar span{opacity:.9;font-variant-numeric:tabular-nums}
/* Hero */
.hero{background:var(--pri-g);color:#fff;text-align:center;padding:32px 20px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.15),transparent 50%),radial-gradient(circle at 80% 90%,rgba(255,255,255,.1),transparent 50%)}
.hero h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;letter-spacing:-1.2px;line-height:1.1;position:relative}
.hero h1 em{font-style:normal;color:#fbbf24}
.hero p{font-size:.78rem;opacity:.85;letter-spacing:3px;margin-top:8px;font-weight:600;position:relative}
.hero svg{display:block;width:100%;max-width:460px;margin:14px auto 0;position:relative}
/* Main */
main{max-width:760px;margin:0 auto;padding:16px 14px 24px}
/* Card */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h3{font-size:1.02rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.card h3 .ico{width:26px;height:26px;border-radius:8px;background:var(--pri-l);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
/* Grid KPI */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--pri-l);border-radius:12px;padding:12px 14px;border:1px solid transparent;transition:border-color var(--tr)}
.k:hover{border-color:var(--pri)}
.k small{color:var(--mu);display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.k b{font-size:1.15rem;font-weight:700;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.k b.pos{color:var(--ok)}.k b.neg{color:var(--rd)}
/* Buttons */
button{font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:var(--r-sm);transition:all var(--tr);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:var(--pri-l);border-color:var(--pri)}
button:active{transform:scale(.97)}
button.pr{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(99,102,241,.3)}
button.pr:hover{background:var(--pri-d);border-color:var(--pri-d)}
button.wa{background:#25d366;color:#fff;border-color:#25d366}
button.wa:hover{background:#1da851;border-color:#1da851}
button.dg{color:var(--rd);border-color:var(--rd)}
button.dg:hover{background:var(--rd-l)}
button:disabled{opacity:.5;cursor:not-allowed}
/* Inputs */
input,select{font:inherit;font-size:.85rem;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:var(--r-sm);padding:9px 12px;max-width:100%;transition:all var(--tr);width:100%}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(99,102,241,.15);background:var(--card)}
input[readonly]{background:var(--ln);color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:10px 0}
.row>div{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.row label{font-size:.72rem;color:var(--mu);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
/* Tables */
.tw{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{border-bottom:1px solid var(--ln);padding:9px 8px;text-align:left;white-space:nowrap;vertical-align:middle}
th{color:var(--mu);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;background:var(--bg)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--pri-l)}
td input{width:80px;padding:5px 7px;font-size:.8rem}
tr.sel td{background:var(--pri-l);border-left:3px solid var(--pri)}
/* Utilities */
.mu{color:var(--mu);font-size:.78rem;line-height:1.4}
.pos{color:var(--ok)}.neg{color:var(--rd)}
.bar{height:14px;background:var(--ln);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(16,185,129,.4)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.rd{background:var(--rd-l);color:var(--rd)}
.badge.pri{background:var(--pri-l);color:var(--pri)}
/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-size:.85rem;font-weight:500;z-index:100;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Login */
#lg{max-width:380px;margin:60px auto;padding:0 16px}
#lg .card{padding:28px 24px}
#lg h2{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
#lg .sub{text-align:center;color:var(--mu);font-size:.85rem;margin-bottom:20px}
#lg .logo{width:64px;height:64px;border-radius:20px;background:var(--pri-g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;margin:0 auto 16px;box-shadow:0 8px 24px rgba(99,102,241,.35)}
/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(15,23,42,.08);backdrop-filter:blur(12px)}
.bnav button{background:none;border:none;padding:6px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:.65rem;font-weight:600;flex:1;max-width:80px}
.bnav button svg{width:22px;height:22px;stroke-width:2}
.bnav button.on{color:var(--pri)}
.bnav button.on svg{stroke:var(--pri)}
.bnav button:hover{background:var(--pri-l)}
/* Menu grid */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.menu-grid button{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 8px;flex-direction:column;gap:8px;font-size:.75rem;height:auto;font-weight:600;box-shadow:var(--sh)}
.menu-grid button:hover{border-color:var(--pri);background:var(--pri-l);transform:translateY(-1px)}
.menu-grid .mi{width:40px;height:40px;border-radius:12px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center}
.menu-grid .mi svg{width:22px;height:22px}
/* Manual */
.manual h2{font-size:1.3rem;font-weight:800;margin:20px 0 10px;color:var(--pri);letter-spacing:-.3px;padding-top:10px;border-top:1px solid var(--ln)}
.manual h2:first-child{border-top:none;padding-top:0;margin-top:0}
.manual h3{font-size:1rem;font-weight:700;margin:16px 0 6px}
.manual p{margin:8px 0;line-height:1.6;font-size:.9rem}
.manual ol,.manual ul{margin:8px 0 8px 22px;font-size:.88rem;line-height:1.6}
.manual li{margin:5px 0}
.manual blockquote{background:var(--pri-l);border-left:4px solid var(--pri);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:.86rem;font-style:italic;color:var(--mu)}
.manual .step{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.manual .step b{background:var(--pri);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.manual .step span{flex:1;font-size:.88rem;line-height:1.5}
</style>
</head>
<body>
<div class="topbar"><b>🤝 Alianza Santiago & Lester</b><span id="clk"></span></div>
<div id="root"></div>
<div id="toast"></div>
<script>
/* ============ MODELO ============
- Cuentas: car (Carro 30%), san (Santiago 50%), les (Lester 20%), osv (Osvaldito préstamo).
- El préstamo se llama OSVALDITO en toda la app. Moneda interna del préstamo: USD.
- La tasa CUP/USD puede editarla cualquier usuario (Santiago es el operador diario).
- Pedidos de Lester: órdenes para usar saldo de 'les' o de 'osv'. Se exportan y Santiago los importa; al "Usarlos" se registra retiro y se descuenta.
- Gastos de Lester: compras que Lester hizo y envió. Si loan=true, aumentan el préstamo de Osvaldito (convertido a USD con la tasa del momento).
- Sin datos de prueba: solo usuarios para poder entrar.
*/
const KEY="alianza-v4";
const ACT=[["pas","Pasajeros"],["ges","Gestión coordinada"],["per","Uso personal"]];
const ACC_LBL={car:"Carro",san:"Santiago",les:"Lester",osv:"Osvaldito · préstamo"};
const UID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toTimeString().slice(0,5);
const $=s=>document.querySelector(s);
const v=i=>document.getElementById(i).value;
const N=(x,d=0)=>(+x||0).toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d});
const E=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let S,me=null,tab="dash",q="",armed="",qm=today().slice(0,7),qh=+today().slice(8)<=15?1:2;

function seed(){
  return{
    cfg:{rate:860,loanPct:50,loanOn:true,wa:"5354065166",shares:[{id:"car",n:"Carro",pct:30},{id:"san",n:"Santiago",pct:50},{id:"les",n:"Lester",pct:20}]},
    users:[{u:"lester",p:"Lester2026",role:"admin",n:"Lester"},{u:"santiago",p:"Santi2026",role:"rep",n:"Santiago"}],
    trips:[],fuel:[],inv:[],lexp:[],orders:[],caja:[],dist:[],log:[]
  };
}
try{S=JSON.parse(localStorage.getItem(KEY));const u=sessionStorage.getItem("u");if(u&&S)me=S.users.find(x=>x.u==u)}catch(e){}
if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Memoria llena")}};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)};
const lg=(a,x)=>S.log.push({id:UID(),d:today(),t:now(),u:me.n,a,x});
const A=()=>me&&me.role=="admin";
const cup=r=>r.cur=="USD"?r.amt*r.rate:r.amt;
const sum=a=>a.reduce((s,r)=>s+cup(r),0);
const sn=id=>ACC_LBL[id]||(S.cfg.shares.find(s=>s.id==id)||{n:id}).n;

/* ===== Préstamo OSVALDITO (USD) ===== */
const loanTot=()=>{
  const invT=S.inv.filter(i=>i.loan).reduce((s,i)=>s+i.amt,0);
  const lexpT=S.lexp.filter(l=>l.loan).reduce((s,l)=>s+(l.amt/(l.rate||S.cfg.rate)),0);
  return invT+lexpT;
};
const loanPaid=()=>S.dist.reduce((s,d)=>s+(d.payUsd||0),0);
const loanPend=()=>Math.max(loanTot()-loanPaid(),0);
const cr=(a,u)=>S.caja.filter(c=>c.kind=="c"&&c.acc==a&&(!u||c.d<=u)).reduce((s,c)=>s+c.amt,0);
const rt=(a,u,f)=>S.caja.filter(c=>c.kind=="r"&&c.acc==a&&(!u||c.d<=u)&&(!f||c.d>=f)).reduce((s,c)=>s+c.amt,0);
const bal=(a,u)=>cr(a,u)-rt(a,u);

function cc(d,litN){
  const T=S.trips.filter(r=>r.d==d&&r.act!="per");
  const F=S.fuel.filter(r=>r.d==d);
  const I=sum(T);
  const litT=F.reduce((s,r)=>s+r.lit,0);
  const imp=sum(F);
  let pl=0;
  if(litT>0){pl=imp/litT}
  else{const last=S.fuel.filter(r=>r.d<=d&&r.lit).sort((a,b)=>a.d>b.d?1:-1).pop();if(last)pl=last.precio||(cup(last)/last.lit)}
  if(!pl||pl<=0)pl=600;
  const fN=litN*pl;
  const litO=Math.max(litT-litN,0);
  const fO=litO*pl;
  const c=S.cfg;
  const Nt=I-fN;
  const payCup=c.loanOn&&Nt>0?Math.min(Nt*c.loanPct/100,loanPend()*c.rate):0;
  const rest=Nt>0?Nt-payCup:0;
  const sh={};
  c.shares.forEach(s=>sh[s.id]=Nt>0?rest*s.pct/100:0);
  return{I,litT,imp,pl,litN,fN,litO,fO,Nt,payCup,payUsd:payCup/c.rate,rest,sh};
}
const qk=d=>d.slice(0,7)+"-"+(+d.slice(8)<=15?1:2);
const mn=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleString("es",{month:"long",year:"numeric"});
const ql=k=>`${k.slice(-1)==1?"1ª":"2ª"} quincena de ${mn(k.slice(0,7))}`;

/* ===== Inputs genéricos ===== */
const SEL={act:()=>ACT,cur:()=>["CUP","USD"],loan:()=>[["1","Sí, es préstamo"],["0","No"]]};
const D=["d","date","Fecha"],H=["t","time","Hora"],AM=["amt","number","Monto"],CU=["cur","cur","Moneda"];
const MOD={
  trips:{t:"Viajes y paquetería",f:[D,H,["act","act","Actividad"],["from","text","Origen"],["to","text","Destino"],AM,CU,["desc","text","Descripción"]],req:["amt"],m:1},
  fuel:{t:"Combustible comprado",f:[D,H,["lit","number","Litros"],["precio","number","Precio CUP/L"],["amt","number","Importe total"],CU,["note","text","Notas"]],req:["lit","precio"],m:1,x:["ppl"]},
  inv:{t:"Inversiones (préstamo Osvaldito, USD)",f:[D,["what","text","Concepto"],["amt","number","Monto USD"],["loan","loan","¿Préstamo?"]],req:["what","amt"],fix:{cur:"USD"},m:1},
  lexp:{t:"Gastos de Lester (compras enviadas a Santiago)",f:[D,["what","text","Concepto"],["amt","number","Monto CUP"],["loan","loan","¿Es parte del préstamo Osvaldito?"],["note","text","Notas"]],req:["what","amt"],m:1}
};
const inp=(k,f)=>{
  const[key,ty,lb]=f,id=`f_${k}_${key}`,w=key=="desc"?` id="wdesc" style="display:none"`:"";
  if(SEL[ty])return`<div><label>${lb}</label><select id="${id}">${SEL[ty]().map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${a}">${b}</option>`}).join("")}</select></div>`;
  if(k=="fuel"&&key=="amt")return`<div><label>${lb} (auto)</label><input id="${id}" type="number" step="any" readonly></div>`;
  return`<div${w}><label>${lb}</label><input id="${id}" type="${ty}" ${ty=="date"?`value="${today()}"`:ty=="time"?`value="${now()}"`:""} ${ty=="number"?'step="any" min="0"':""}></div>`;
};
const cell=(r,key)=>{
  if(key=="act")return E((ACT.find(a=>a[0]==r.act)||["","?"])[1]);
  if(key=="loan")return r.loan?"Sí":"No";
  if(key=="cup")return N(cup(r));
  if(key=="ppl")return N(cup(r)/r.lit,2);
  if(key=="amt")return N(r.amt,2);
  return E(r[key]);
};
function mod(k,extra=""){
  const M=MOD[k],cols=[...M.f.map(f=>f[0]),...(M.m?["cup"]:[]),...(M.x||[]),"by"];
  const lab={cup:"CUP",by:"Por",ppl:"CUP/L"};
  const rows=[...S[k]].reverse().filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
  return`${extra}<div class="card"><h3><span class="ico">✚</span>${M.t}</h3><div class="row">${M.f.map(f=>inp(k,f)).join("")}<button class="pr" data-add="${k}">Registrar</button></div></div>
  <div class="card"><input id="q" placeholder="🔍 Buscar..." value="${E(q)}"><div class="tw"><table><tr>${cols.map(c=>`<th>${lab[c]||(M.f.find(f=>f[0]==c)||[])[2]}</th>`).join("")}<th></th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${cell(r,c)}</td>`).join("")}<td>${A()?`<button class="dg" data-del="${k}|${r.id}">${armed==k+r.id?"¿Seguro?":"✕"}</button>`:""}</td></tr>`).join("")||"<tr><td colspan='99' class='mu' style='text-align:center;padding:20px'>Sin registros</td></tr>"}</table></div><p class="mu" style="margin-top:10px">Total CUP${k=="fuel"?" y litros":""}: <b>${N(sum(rows))}</b>${k=="fuel"?` · ${N(rows.reduce((s,r)=>s+r.lit,0),1)} L`:""}</p></div>`;
}

/* ===== Vistas ===== */
const kp=(l,x,c="")=>`<div class="k"><small>${l}</small><b class="${c}">${x}</b></div>`;
const ico=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;stroke-width:2"><path d="${p}"/></svg>`;

function hero(){return`<section class="hero"><h1>Alianza <em>entre amigos</em></h1><p>SANTIAGO Y LESTER</p><svg viewBox="0 0 560 110"><rect y="88" width="560" height="22" fill="#0f172a" rx="4"/><path d="M0 99h560" stroke="#fff" stroke-dasharray="24 14" stroke-width="3"/><path d="M180 88V66l22-22h80l28 22h36v22z" fill="#fbbf24"/><path d="M208 66l14-16h44l18 16z" fill="#bfe6ff"/><circle cx="218" cy="89" r="14" fill="#0f172a" stroke="#fff" stroke-width="3.5"/><circle cx="318" cy="89" r="14" fill="#0f172a" stroke="#fff" stroke-width="3.5"/><text x="44" y="82" font-size="38">🧑‍🔧</text><text x="450" y="82" font-size="38">🧑‍💼</text></svg></section>`}

function dash(){
  const f=qm+"-"+(qh==1?"01":"16"),t=qm+"-"+(qh==1?"15":"31");
  const Q=S.dist.filter(x=>x.d>=f&&x.d<=t);
  const sm=k=>Q.reduce((s,x)=>s+(x[k]||0),0);
  const sh=id=>Q.reduce((s,x)=>s+(x.sh[id]||0),0);
  const r=S.cfg.rate,pr=loanTot()?loanPaid()/loanTot()*100:0;
  const ent=a=>rt(a,t,f),pen=a=>bal(a,t);
  const keys=[...new Set(S.dist.map(x=>qk(x.d)))].sort().reverse();
  return`${hero()}<main>
  <div class="card" style="text-align:center"><h3 style="justify-content:center"><span class="ico">📖</span>Manual de uso para Santiago</h3><p class="mu" style="margin-bottom:10px">Escrito por Lester para ti. Aquí está todo lo que necesitas saber, paso a paso.</p><button class="pr" data-t="manual">Abrir manual de uso</button></div>
  <div class="card"><h3><span class="ico">💱</span>Tasa de cambio CUP/USD</h3><div class="row"><div style="flex:1"><label>CUP por 1 USD (cualquiera puede editarla)</label><input type="number" data-cf="rate" value="${r}" min="1"></div></div><p class="mu">Usa la tasa del día. Afecta conversiones del préstamo y gastos.</p></div>

function manual(){
  return`<main class="manual">
  <div class="card" style="background:var(--pri-g);color:#fff;text-align:center"><h2 style="color:#fff;border:none;margin:0 0 8px;padding:0;font-size:1.3rem">📖 Manual de uso</h2><p style="opacity:.9;margin:0;font-size:.88rem">Escrito por Lester para Santiago</p></div>
  <div class="card">
  <h2>👋 Hola, Santiago</h2>
  <p>Este manual lo escribí yo, Lester, para que tengas claro cómo usar la app en tu día a día. La idea es que entre los dos llevemos las cuentas claras, sin enredos. Léelo con calma la primera vez y después consúltalo cuando tengas dudas.</p>
  <blockquote>Regla de oro: todo lo que entra o sale del carro debe quedar registrado. Si no está en la app, no existe.</blockquote>

  <h2>🔐 1. Entrar a la app</h2>
  <div class="step"><b>1</b><span>Escribe tu usuario <b>santiago</b> y tu clave (te la di personalmente).</span></div>
  <div class="step"><b>2</b><span>Pulsa <b>Entrar</b>. Si te equivocas, te saldrá un mensaje y podrás intentarlo de nuevo.</span></div>
  <div class="step"><b>3</b><span>Si olvidas la clave, avísame y te la cambio desde mi panel de administrador.</span></div>

  <h2>🏠 2. Pantalla de inicio</h2>
  <p>Aquí ves el resumen del negocio. Lo más importante:</p>
  <ul>
    <li><b>Tasa CUP/USD</b>: la puedes cambiar tú mismo con el botón del lápiz. Usa la tasa del día. Afecta los cálculos del préstamo de Osvaldito.</li>
    <li><b>Préstamo de Osvaldito</b>: la barra muestra cuánto se ha recuperado. El dinero es de Osvaldito; yo solo lo administro.</li>
    <li><b>Quincena</b>: selecciona el mes y la quincena para ver resultados. Solo cuentan los días cerrados.</li>
    <li><b>Reparto por socio</b>: Carro 30%, tú 50%, yo 20%. Esto se calcula al cerrar cada día.</li>
  </ul>

  <h2>🚗 3. Registrar viajes</h2>
  <div class="step"><b>1</b><span>Entra a <b>Viajes</b> en la barra inferior.</span></div>
  <div class="step"><b>2</b><span>Completa: fecha, hora, actividad (Pasajeros, Gestión coordinada, Uso personal), origen, destino y monto.</span></div>
  <div class="step"><b>3</b><span>Si es <b>Gestión coordinada</b>, describe qué se hizo (ej.: "Compra de piezas").</span></div>
  <div class="step"><b>4</b><span>Si es <b>Uso personal</b>, el monto es 0 (no genera ingreso, pero queda registrado).</span></div>
  <div class="step"><b>5</b><span>Pulsa <b>Registrar</b>. Verás el viaje en la tabla.</span></div>

  <h2>⛽ 4. Combustible</h2>
  <p><b>Importante:</b> no tienes que registrar combustible todos los días. Solo cuando compres.</p>
  <div class="step"><b>1</b><span>Entra a <b>Combustible</b> en el menú "Más".</span></div>
  <div class="step"><b>2</b><span>Pon los litros y el precio por litro. El importe se calcula solo.</span></div>
  <div class="step"><b>3</b><span>Si el precio cambia, actualízalo. La app usa el precio de la última compra para calcular el gasto diario.</span></div>

  <h2>✅ 5. Cerrar el día (lo más importante)</h2>
  <p>Esto lo haces <b>al final de cada día</b>, cuando ya no haya más viajes.</p>
  <div class="step"><b>1</b><span>Entra a <b>Cierre</b> en la barra inferior.</span></div>
  <div class="step"><b>2</b><span>Verifica que la fecha sea la correcta.</span></div>
  <div class="step"><b>3</b><span>Indica <b>cuántos litros de combustible</b> se usaron en el negocio conjunto (no en tus asuntos personales).</span></div>
  <div class="step"><b>4</b><span>Revisa el resumen: ingresos, combustible, neta y reparto. Si todo está bien, pulsa <b>Cerrar día</b>.</span></div>
  <div class="step"><b>5</b><span>Se reparte automáticamente: 50% al préstamo de Osvaldito (si está pendiente), y el resto 30/50/20.</span></div>
  <div class="step"><b>6</b><span>Pulsa <b>Salva + WhatsApp</b> para enviarme el cierre al +5354065166. Yo lo importaré y veré todo.</span></div>
  <blockquote>Si cierras el día por error, avísame. Solo yo puedo borrar un cierre.</blockquote>

  <h2>💰 6. Caja</h2>
  <p>Aquí ves el saldo de cada cuenta:</p>
  <ul>
    <li><b>Carro</b>: 30% para compras y reparaciones.</li>
    <li><b>Santiago</b>: tu 50%.</li>
    <li><b>Lester</b>: mi 20%.</li>
    <li><b>Osvaldito · préstamo</b>: lo apartado para devolverle el préstamo.</li>
  </ul>
  <p>Cuando <b>entregues dinero</b> a alguien o <b>uses saldo</b> (compras, reparaciones), regístralo con el botón <b>Registrar entrega / retiro</b>. Así el saldo disponible se mantiene correcto.</p>
  <blockquote>Ejemplo: si compras una pieza con el dinero del Carro, registra un retiro de la cuenta Carro con el concepto "Compra de pieza X".</blockquote>

  <h2>📨 7. Pedidos de Lester</h2>
  <p>Cuando yo necesite que uses parte de mi saldo o del pendiente de Osvaldito para algo, te dejo un <b>pedido</b> en la app. Al importar mi salva, aparecerá en esta sección.</p>
  <div class="step"><b>1</b><span>Entra a <b>Pedidos</b> en "Más".</span></div>
  <div class="step"><b>2</b><span>Verás los pedidos pendientes. Cuando cumplas uno (compres lo que pedí o uses el saldo), pulsa <b>Usar</b>.</span></div>
  <div class="step"><b>3</b><span>Se registrará automáticamente el retiro de la cuenta correspondiente y el pedido quedará marcado como usado.</span></div>

  <h2>🛍️ 8. Gastos de Lester</h2>
  <p>Cuando yo compre algo para el negocio y te lo envíe (piezas, insumos, etc.), lo registras aquí. Si es parte del préstamo de Osvaldito, aumenta el total. Si no, queda como gasto mío.</p>

  <h2>📤 9. Salvas (importar y exportar)</h2>
  <div class="step"><b>1</b><span>Entra a <b>Salvas</b> en "Más".</span></div>
  <div class="step"><b>2</b><span>Para enviarme datos: selecciona el rango de fechas y pulsa <b>Compartir/descargar</b> o <b>WhatsApp</b>.</span></div>
  <div class="step"><b>3</b><span>Para importar lo que yo te envíe: en <b>Importar salva</b>, elige el archivo .json que te mandé y se agregarán los registros nuevos.</span></div>
  <blockquote>La importación nunca borra tus datos anteriores. Solo agrega.</blockquote>

  <h2>⏰ 10. Rutina recomendada</h2>
  <h3>Diaria (al final del día)</h3>
  <ol>
    <li>Registrar todos los viajes del día.</li>
    <li>Registrar compras de combustible si las hubo.</li>
    <li>Cerrar el día y enviar salva por WhatsApp.</li>
  </ol>
  <h3>Semanal</h3>
  <ol>
    <li>Revisar la caja y registrar entregas o retiros.</li>
    <li>Verificar que los saldos coincidan con el dinero real.</li>
  </ol>
  <h3>Quincenal</h3>
  <ol>
    <li>Revisar el resumen de la quincena en Inicio.</li>
    <li>Entregar a Osvaldito lo acumulado en su cuenta.</li>
    <li>Revisar conmigo si hay pedidos pendientes.</li>
  </ol>

  <h2>💡 11. Consejos finales</h2>
  <ul>
    <li>No dejes para mañana los cierres: entre más rápido, menos errores.</li>
    <li>Si un viaje se te olvidó, regístralo igual con la fecha correcta.</li>
    <li>Ante cualquier duda, escríbeme por WhatsApp. Es mejor preguntar que adivinar.</li>
    <li>Revisa la tasa de cambio cada vez que cambie: afecta el préstamo de Osvaldito.</li>
    <li>Guarda tus salvas: son tu respaldo si algo pasa con el teléfono.</li>
  </ul>
  <blockquote>Cualquier cosa, aquí estoy. Entre los dos sacamos esto adelante. — Lester</blockquote>
  </div></main>`;
}

function mas(){
  const items=[
    ["fuel","⛽","Combustible"],["inv","🏦","Inversiones"],["orders","📨","Pedidos"],["lexp","🛍️","Gastos Lester"],
    ["soc","👥","Socios"],["aud","🔍","Auditoría"],["salv","📤","Salvas"],["manual","📖","Manual"],["cfg","⚙️","Config"]
  ].filter(i=>!["soc","aud","cfg"].includes(i[0])||A());
  return`<main><div class="card"><h3><span class="ico">📂</span>Más secciones</h3><div class="menu-grid">${items.map(([t,i,l])=>`<button data-t="${t}"><span class="mi">${i}</span>${l}</button>`).join("")}</div></div></main>`;
}

function R(){
  if(!me){
    $("#root").innerHTML=`<div id="lg"><div class="card"><div class="logo">🤝</div><h2>Alianza</h2><p class="sub">Santiago & Lester</p><div class="row"><div><label>Usuario</label><input id="lu" autocomplete="username"></div></div><div class="row"><div><label>Clave</label><input id="lp" type="password" autocomplete="current-password"></div></div><button class="pr" data-login="1" style="width:100%;margin-top:8px;padding:11px">Entrar</button></div></div>`;
    return;
  }
  const V={dash,cierre,caja,inv,soc,aud,salv,cfg,manual,mas,trips:()=>mod("trips"),fuel:()=>mod("fuel"),orders,lexp};
  $("#root").innerHTML=`${V[tab]()}<nav class="bnav">${[
    ["dash","Inicio",'M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10'],
    ["trips","Viajes",'M5 17h14M5 17a2 2 0 01-2-2V9a2 2 0 012-2h1l2-3h8l2 3h1a2 2 0 012 2v6a2 2 0 01-2 2M5 17v2m14-2v2'],
    ["cierre","Cierre",'M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z'],
    ["caja","Caja",'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2zM16 12h.01'],
    ["mas","Más",'M4 6h16M4 12h16M4 18h16']
  ].map(([t,l,p])=>`<button class="${tab==t?"on":""}" data-t="${t}">${ico(p)}<span>${l}</span></button>`).join("")}</nav>`;
  save();
  const x=$("#q");if(x&&q){x.focus();x.setSelectionRange(q.length,q.length)}
  if(tab=="fuel"){
    const lit=$("#f_fuel_lit"),pre=$("#f_fuel_precio"),tot=$("#f_fuel_amt");
    const calc=()=>{if(lit&&pre&&tot){const l=+lit.value||0,p=+pre.value||0;tot.value=(l*p).toFixed(2)}};
    if(lit&&pre){lit.addEventListener("input",calc);pre.addEventListener("input",calc)}
  }
}
setInterval(()=>{$("#clk").textContent=new Date().toLocaleString("es",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})},1000);

/* ===== Salvas ===== */
const KS=["trips","fuel","inv","lexp","orders","caja","dist","log"];
function expo(full){
  const f=v("xf"),t=v("xt"),ok=d=>!d||((!f||d>=f)&&(!t||d<=t));
  const o={v:4,by:me.n,ts:new Date().toISOString(),from:f,to:t};
  KS.forEach(k=>o[k]=S[k].filter(r=>ok(r.d)));
  if(full&&A()){o.cfg=S.cfg;o.users=S.users}
  return o;
}
function imp(o,rc){
  let n=0;
  KS.forEach(k=>(o[k]||[]).forEach(i=>{if(!S[k].some(x=>x.id==i.id)){S[k].push(i);n++}}));
  if(A()&&rc&&o.cfg){S.cfg=o.cfg;S.users=o.users||S.users}
  lg("Importó salva",`${n} nuevos de ${o.by||"?"}`);
  return n;
}
function enviarSalvaDia(){
  const d=$("#cd")?v("cd"):today();
  const o={v:4,by:me.n,ts:new Date().toISOString(),from:d,to:d};
  KS.forEach(k=>o[k]=S[k].filter(r=>r.d==d));
  const D0=S.dist.filter(x=>x.d==d)[0]||{};
  const g=k=>D0[k]||0;
  const txt=`📋 *Salva del día ${d}*\n📊 Ingresos: ${N(g("I"))} CUP\n⛽ Combustible: ${N(g("fN"))} CUP\n💰 Neta: ${N(g("Nt"))} CUP\n🏦 A Osvaldito: ${N(g("payCup"))} CUP\n👥 Reparto: ${S.cfg.shares.map(s=>s.n+" "+N((D0.sh||{})[s.id]||0)).join(" · ")}\n📉 Préstamo pendiente: USD ${N(loanPend(),2)}`;
  window.open(`https://wa.me/${S.cfg.wa}?text=${encodeURIComponent(txt)}`,"_blank","noopener");
  lg("Envió salva por WhatsApp",d);
  const file=new File([JSON.stringify(o)],`salva-${d}.json`,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:"Salva Alianza"}).catch(()=>{});
}

/* ===== Eventos ===== */
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;R()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="lp")document.querySelector("[data-login]").click()});

document.addEventListener("click",async e=>{
  const tg=e.target.closest("[data-login],[data-out],[data-t],[data-add],[data-del],[data-close],[data-ret],[data-as],[data-ds],[data-au],[data-du],[data-reset],[data-x],[data-q],[data-wadian],[data-addorder],[data-useorder]");
  if(!tg)return;const d=tg.dataset;
  if(d.login){const u=S.users.find(x=>x.u==v("lu").trim().toLowerCase()&&x.p==v("lp"));if(!u)return toast("Usuario o clave incorrectos");me=u;try{sessionStorage.setItem("u",u.u)}catch(z){}tab="dash";lg("Inició sesión","");return R()}
  if(d.out){me=null;try{sessionStorage.removeItem("u")}catch(z){}return R()}
  if(d.t){tab=d.t;q="";armed="";return R()}
  if(d.q){qm=d.q.slice(0,7);qh=+d.q.slice(-1);return R()}
  if(d.add){
    const k=d.add,M=MOD[k],r={id:UID(),rate:S.cfg.rate,by:me.n,...(M.fix||{})};
    M.f.forEach(([key,ty])=>{let x=v(`f_${k}_${key}`);if(ty=="number")x=+x;if(ty=="loan")x=x=="1";r[key]=x});
    if(k=="fuel"&&r.lit&&r.precio)r.amt=r.lit*r.precio;
    if(k=="trips"){if(r.act=="per")r.amt=0;else if(!r.amt)return toast("Falta el monto");if(r.act=="ges"&&!r.desc)return toast("Describe la gestión")}
    else if(M.req.some(x=>!r[x]))return toast("Completa los campos");
    S[k].push(r);lg("Registró: "+M.t,`${r.what||r.desc||""} ${r.lit?N(r.lit,1)+" L ":""}${r.amt?N(r.amt,2)+" "+r.cur:""}`);toast("Guardado");return R();
  }
  if(d.del){const[k,id]=d.del.split("|");if(armed!=k+id){armed=k+id;return R()}S[k]=S[k].filter(r=>r.id!=id);if(k=="dist")S.caja=S.caja.filter(c=>c.auto!=id);lg("Eliminó",k);armed="";return R()}
  if(d.close){
    const dt=v("cd"),L=v("cl")===""?cc(dt,0).litT:+v("cl"),c=cc(dt,L);
    if(S.dist.some(x=>x.d==dt))return toast("Día ya cerrado");
    if(!c.I&&!c.litT)return toast("Sin movimientos");
    const id=UID();S.dist.push({id,d:dt,by:me.n,...c});
    S.cfg.shares.forEach(s=>c.sh[s.id]>0&&S.caja.push({id:UID(),d:dt,t:now(),acc:s.id,kind:"c",concept:"Reparto "+dt,amt:c.sh[s.id],by:me.n,auto:id}));
    if(c.payCup>0)S.caja.push({id:UID(),d:dt,t:now(),acc:"osv",kind:"c",concept:"Recuperación Osvaldito "+dt,amt:c.payCup,by:me.n,auto:id});
    lg("Cerró día",`${dt}: neta ${N(c.Nt)}`);toast("Día cerrado");return R();
  }
  if(d.wadian){enviarSalvaDia();return}
  if(d.ret){const a=v("ra"),m=+v("rm");if(!v("rc")||!(m>0))return toast("Completa concepto y monto");if(m>bal(a))return toast("Supera saldo ("+N(bal(a))+")");S.caja.push({id:UID(),d:v("rd")||today(),t:now(),acc:a,kind:"r",concept:v("rc"),amt:m,by:me.n});lg("Retiro",`${sn(a)}: ${N(m)}`);toast("Registrado");return R()}
  if(d.addorder){
    const acc=v("oa"),concept=v("oc"),amt=+v("om"),cur=v("ocur");
    if(!concept||!(amt>0))return toast("Completa concepto y monto");
    S.orders.push({id:UID(),d:today(),by:me.n,acc,concept,amt,cur,status:"pend"});
    lg("Creó pedido",`${sn(acc)}: ${N(amt)} ${cur} · ${concept}`);toast("Pedido creado");return R();
  }
  if(d.useorder){
    const o=S.orders.find(x=>x.id==d.useorder);if(!o||o.status=="used")return toast("Pedido no disponible");
    const amtCup=o.cur=="USD"?o.amt*S.cfg.rate:o.amt;
    if(amtCup>bal(o.acc))return toast("Saldo insuficiente en "+sn(o.acc)+" ("+N(bal(o.acc))+")");
    S.caja.push({id:UID(),d:today(),t:now(),acc:o.acc,kind:"r",concept:"Pedido: "+o.concept,amt:amtCup,by:me.n});
    o.status="used";o.usedD=today();o.usedBy=me.n;
    lg("Usó pedido",`${sn(o.acc)}: ${N(amtCup)} CUP · ${o.concept}`);
    toast("Pedido usado y retiro registrado");return R();
  }
  if(d.as&&v("ns")){S.cfg.shares.push({id:UID(),n:v("ns"),pct:+v("np")||0});lg("Agregó socio",v("ns"));return R()}
  if(d.ds){S.cfg.shares=S.cfg.shares.filter(s=>s.id!=d.ds);return R()}
  if(d.au&&v("uu")&&v("up")){if(S.users.some(x=>x.u==v("uu").toLowerCase()))return toast("Usuario existe");S.users.push({u:v("uu").toLowerCase(),p:v("up"),role:v("ur"),n:v("un")||v("uu")});lg("Creó usuario",v("uu"));return R()}
  if(d.du){S.users=S.users.filter(x=>x.u!=d.du);lg("Eliminó usuario",d.du);return R()}
  if(d.reset){if(armed!="reset"){armed="reset";return R()}try{localStorage.removeItem(KEY)}catch(z){}S=seed();me=null;armed="";return R()}
  if(d.x){
    const full=d.x=="full",o=expo(full),f=`salva-${me.u}-${today()}.json`;
    if(d.x=="wa"){
      const g=k=>(o.dist||[]).reduce((s,x)=>s+(x[k]||0),0);
      const txt=`Reporte ${me.n} ${o.from||""} a ${o.to||""}\nIngresos: ${N(g("I"))} CUP · Neta: ${N(g("Nt"))} CUP\nA Osvaldito: ${N(g("payCup"))} CUP\n${S.cfg.shares.map(s=>s.n+": "+N((o.dist||[]).reduce((a,x)=>a+((x.sh||{})[s.id]||0),0))).join(" · ")}\nPréstamo pendiente: USD ${N(loanPend(),2)}`;
      window.open(`https://wa.me/${S.cfg.wa}?text=${encodeURIComponent(txt)}`,"_blank","noopener");lg("Envió WhatsApp","");return;
    }
    const file=new File([JSON.stringify(o)],f,{type:"application/json"});lg("Exportó salva",f);
    if(!full&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Salva Alianza"});return}catch(z){}}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=f;a.click();toast("Salva descargada");
  }
});

document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset,c=S.cfg;
  if(t.id=="f_trips_act"){$("#wdesc").style.display=t.value=="ges"?"":"none";return}
  if(t.id=="qm"){qm=t.value||qm;return R()}
  if(t.id=="qh"){qh=+t.value;return R()}
  if(d.cf){c[d.cf]=t.type=="checkbox"?t.checked:t.type=="number"?+t.value:t.value;lg("Cambió config",d.cf);return R()}
  if(d.sn){c.shares.find(s=>s.id==d.sn).n=t.value;return R()}
  if(d.sp){c.shares.find(s=>s.id==d.sp).pct=+t.value;lg("Cambió porcentajes","");return R()}
  if(d.pw&&t.value){S.users.find(x=>x.u==d.pw).p=t.value;lg("Cambió clave",d.pw);toast("Clave actualizada");t.value="";}
  if(["cd","cl","cf","af","au"].includes(t.id))return R();
  if(t.id=="imp"){
    const f=t.files[0],r=new FileReader();
    r.onload=()=>{try{const n=imp(JSON.parse(r.result),$("#ic")&&$("#ic").checked);toast(`Salva importada: ${n} registros nuevos`);R()}catch(z){toast("Archivo no válido")}};
    f&&r.readAsText(f);
  }
});

R();
</script>
